# ==============================================================================
# Semi-Supervised Flood Segmentation Benchmark: Default Configuration
# ==============================================================================

# Global Execution Settings
seed: 42
device: "cuda"            # "cuda" or "cpu"

# Image & Spatial Standardization
data:
  size: 256               # Standardized 256x256 image resolution
  in_channels: 3
  num_classes: 2          # 2-class logits (Channel 0: Background, Channel 1: Flood)
  data_root: "data_raw"
  splits_dir: "splits"
  num_workers: 4

# Protocol Ratios
protocol:
  ratios: [0.10, 0.25, 0.50, 1.00]
  metric_target: "flood_iou"

# Standard Optimization
train:
  epochs: 40
  batch_size: 4
  lr: 1.0e-4
  weight_decay: 0.01
  optimizer: "AdamW"      # "AdamW" or "Adam"
  scheduler:
    type: "cosine"        # "cosine" or "plateau"
    min_lr: 1.0e-6
    patience: 9
    factor: 0.6

# Semi-Supervised Consistency Settings
ema:
  enabled: true
  warmup_iters: 200
  max_decay: 0.996

# Semi-Supervised Consistency Loss Parameters
loss:
  unsup_tau: 0.4          # Uncertainty threshold
  loss_u_scale: 0.2       # Weight for unsupervised loss (lambda_u)
  alpha: 0.7              # High-confidence pixel weight
  beta: 0.3               # Low-confidence pixel weight
  sup_loss: "dice_ce"     # Supervised loss combination

# Output & Logging
output:
  root_dir: "results"
  save_qualitative: true
  num_qualitative_samples: 4
